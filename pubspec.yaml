name: skill_scanner
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3
  firebase_analytics: ^12.0.4
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.1.0
  url_launcher: ^6.3.2
  sqflite: ^2.2.0+3
  path: ^1.8.4
  path_provider: ^2.0.15
  share_plus: ^12.0.1
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  # اصلاح نسخه به 0.14.4 برای رفع خطای ترمینال (دستور شماره ۱۰)
  flutter_launcher_icons: "^0.14.4"
  # اضافه شده برای مرحله ۲ جدول (Splash Screen)
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  # معرفی فولدر آیکون (دستور شماره ۹)
  assets:
    - assets/icon/